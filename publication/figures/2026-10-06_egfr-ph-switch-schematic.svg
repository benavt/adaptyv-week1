<text x="662" y="412" font-size="18" font-weight="700">Expose DD1; favor receptor contacts</text>
<text x="662" y="441" font-size="16" fill="#607184">DD2 protonation could weaken masking.</text>
<text x="662" y="470" font-size="16" fill="#607184">Target His protonation could favor DD1 carboxylates.</text>
<path d="M583 294H614" stroke="#556575" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="541" font-size="18" font-weight="700">Design → predict human + mouse complexes → assess confidence, site pKas and affinity</text>
<text x="40" y="576" font-size="16" fill="#607184">Site-specific pKas, geometry and competing states determine whether the proposed response occurs.</text>
<text x="40" y="609" font-size="16" fill="#607184">Schematic only • no measured switching, state populations or pH-specific Kd are established.</text>
