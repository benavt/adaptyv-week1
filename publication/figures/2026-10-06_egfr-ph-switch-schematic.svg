<title id="title">Proposed pH-dependent DD1/DD2 masking of an EGFR binder</title>
<desc id="desc">At pH 7.4 a covalently tethered magenta DD2 mask occupies cyan DD1. At pH 6.5 the proposed accessible state binds grey EGFR domain III through contacts involving target histidines H37 and H100. Both panels are hypotheses, not measured pH-specific structures.</desc>
