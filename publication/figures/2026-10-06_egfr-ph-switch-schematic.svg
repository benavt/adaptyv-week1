<text x="72" y="394" font-size="18" font-weight="700">DD2 competes for the DD1 binding face</text>
<text x="72" y="425" font-size="16" fill="#607184">Neutral-pH mask contacts are a design objective.</text>
<text x="72" y="453" font-size="16" fill="#607184">Grey curved line: covalent DD2–DD1 tether.</text>
